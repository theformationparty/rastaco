<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RASTA & CO. — TRANSITION RELIEF FOR PEOPLE WHO LOSE LIVELIHOODS TO PROHIBITION">
    <title>RASTA & CO.</title>
    <link rel="stylesheet" href="global.css">
    <link rel="icon" type="image/x-icon" href="1.png">
</head>
<body>
    <div class="popsIn" id="logo_div">
        <img class="nope" id="logo" src="1.png">
    </div>
    <header class="popsIn">
        <img id="text_logo" src="4.png">
        <p class="nope tagline">PROHIBITION SHOULD NOT DESTROY A PERSON'S LIFE</p>
    </header>
    <main class="popsIn">
        <div class="video_wrap">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="Rasta & Co. Relief Fund" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <p class="nope emphasis">
            PROHIBITION

            <span class="red underline">THAT WERE LAWFUL</span>

            SUPPORTERS,
            <span class="red underline">FUND THE SAFETY NET</span>
        </p>
        <p class="nope">
            AFFECTED PEOPLE,
            <span class="red underline">APPLY FOR RELIEF</span>
        </p>

        <div class="action_tabs">
            <button id="give_btn">GIVE NOW</button>
            <button id="sponsor_btn">SPONSOR THE FUND</button>
            <button id="apply_btn">APPLY FOR RELIEF</button>
        </div>

    <footer class="popsIn">
        <p>
            <span id="rasta_nova_span">
                <img class="rasta_nova_logo" src="2.png">
                RASTA NOVA
                <img class="rasta_nova_logo" src="2.png">
            </span>
        </p>
        <p class="nope">RASTA & CO. &copy; 2026</p>
        <hr>
    </footer>
    <script src="global.js"></script>
